# Basic configs
set -g mouse on
set-option -g history-limit 5000

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# 기본 프리픽스를 Ctrl + o로 변경
unbind C-b
set-option -g prefix C-o
bind C-o send-prefix

# 윈도우 이름 자동 변경 활성화
set-window-option -g automatic-rename on

# 수평 분할: Ctrl + o 그 다음 h
bind h split-window -v -c "#{pane_current_path}"

# 수직 분할: Ctrl + o 그 다음 v
bind v split-window -h -c "#{pane_current_path}"

# Pane management
bind -n ^H select-pane -L
bind -n ^L select-pane -R
bind -n ^K select-pane -U
bind -n ^J select-pane -D
bind -n WheelUpPane copy-mode
bind s setw synchronize-panes on
bind S setw synchronize-panes off
bind j command-prompt -p "join pane from:" "join-pane -s ':%%'"
bind J break-pane

# Scrollback vim-style copy/paste
unbind [
bind-key [ copy-mode
bind-key C-[ copy-mode
unbind p
bind ] paste-buffer

set-window-option -g mode-keys vi
if-shell "tmux -V | awk '{exit !($2 >= \"2.4\")}'" \
    'bind-key -Tcopy-mode-vi v send -X begin-selection; bind-key -Tcopy-mode-vi y send -X copy-selection-and-cancel; bind-key -Tcopy-mode-vi [ send -X copy-selection; bind-key -Tcopy-mode-vi Escape send -X cancel'
if-shell "tmux -V | awk '{exit !($2 < \"2.4\")}'" \
    'bind-key -t vi-copy v begin-selection; bind-key -t vi-copy y copy-selection; bind-key -t vi-copy [ copy-selection; bind-key -t vi-copy Escape cancel'

set -g mouse on 
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'" 
bind -n WheelDownPane select-pane -t= \; send-keys -M 
if-shell "tmux -V | awk '{exit !($2 >= \"2.4\")}'" \
    'bind-key -Tcopy-mode-vi C-WheelUpPane send -X halfpage-up; bind-key -Tcopy-mode-vi C-WheelDownPane send -X halfpage-down'
if-shell "tmux -V | awk '{exit !($2 < \"2.4\")}'" \
    'bind-key -t vi-copy C-WheelUpPane halfpage-up; bind-key -t vi-copy C-WheelDownPane halfpage-down'

bind m set -g mouse on;
bind M set -g mouse off;

# Themes
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'frappe' # latte,frappe, macchiato or mocha

set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator " █"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session date_time"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"


# Option(Alt) + Command + ←/→ 로 윈도우(탭) 이동
# Alacritty 가 보내는 커스텀 시퀀스를 user-keys 로 받아서 바인딩
set -s user-keys[0] "\033[1;11D"   # opt+cmd+Left
set -s user-keys[1] "\033[1;11C"   # opt+cmd+Right
bind -n User0 previous-window
bind -n User1 next-window

# Option(Alt) + 방향키 로 현재 윈도우(탭) 안의 pane 이동
# Ctrl + h/j/k/l 과 같은 동작이며, 방향키로도 쓸 수 있게 한 것이다.
#
# 표준 Alt 시퀀스(\033[1;3A~D)를 쓰고 M-Up/M-Left 로 바인딩하면 안 된다. tmux 는 meta 비트가
# 들어간 시퀀스도 전부 M-* 로 해석하기 때문에, Cmd+방향키(\033[1;9x)까지 같이 걸려서
# Cmd 만 눌러도 pane 이 움직인다. 그래서 수정자 20 이라는 사설값을 쓴다. 실제 터미널이 내보내지
# 않는 값이고 tmux 기본 파싱에서도 무의미해서, user-keys 바이트 완전 일치로만 잡힌다.
set -s user-keys[2] "\033[1;20D"   # opt+Left
set -s user-keys[3] "\033[1;20C"   # opt+Right
set -s user-keys[4] "\033[1;20A"   # opt+Up
set -s user-keys[5] "\033[1;20B"   # opt+Down
bind -n User2 select-pane -L
bind -n User3 select-pane -R
bind -n User4 select-pane -U
bind -n User5 select-pane -D

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

